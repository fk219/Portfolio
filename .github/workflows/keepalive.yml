name: Keep Render APIs awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping every API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Warm the Render services
        shell: bash
        run: |
          set -u
          urls=(
            "https://hookedoncakes.onrender.com/api/product/list"
            "https://klinikly-api.onrender.com/health"
            "https://foliofind.onrender.com/api/books?limit=1"
            "https://learnhub-api-6maa.onrender.com/api/health"
            "https://upi-mesh-api-knu5.onrender.com/api/health"
            "https://packet-analyzer-api-11k7.onrender.com/api/health"
            "https://vector-ai-api.onrender.com/api/health"
          )

          for url in "${urls[@]}"; do
            echo "Pinging ${url}"
            curl \
              --silent \
              --show-error \
              --location \
              --max-time 100 \
              --retry 3 \
              --retry-delay 10 \
              --retry-all-errors \
              --output /dev/null \
              --write-out "%{http_code} %{time_total}s\n" \
              "${url}" || echo "WARN: ${url} did not answer yet"
          done
