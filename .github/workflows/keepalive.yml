name: Keep Render APIs awake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping every API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Warm the Render services
        shell: bash
        run: |
          set -u
          urls=(
            "https://model-compare-api.onrender.com/health"
            "https://photo-social-api.onrender.com/health"
            "https://mood-music-api-akb5.onrender.com/health"
            "https://research-desk-api.onrender.com/health"
            "https://hookedoncakes.onrender.com/health"
            "https://klinikly-api.onrender.com/health"
            "https://foliofind.onrender.com/api/books?limit=1"
            "https://learnhub-api-6maa.onrender.com/api/health"
            "https://mesh-pay-api.onrender.com/api/health"
            "https://packet-analyzer-api-ud0m.onrender.com/api/health"
            "https://vector-search-api-je4n.onrender.com/api/health"
          )

          for url in "${urls[@]}"; do
            echo "Pinging ${url}"
            curl \
              --silent \
              --show-error \
              --location \
              --max-time 100 \
              --retry 3 \
              --retry-delay 10 \
              --retry-all-errors \
              --output /dev/null \
              --write-out "%{http_code} %{time_total}s\n" \
              "${url}" || echo "WARN: ${url} did not answer yet"
          done
